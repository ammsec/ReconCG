<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReconCG</title>

<link rel="stylesheet" href="assets/css/style.css">

</head>


<body>


<nav>

<div class="logo">
ReconCG
</div>


<ul>

<li>
<a href="#home">
Home
</a>
</li>


<li>
<a href="#generator">
Generator
</a>
</li>


<li>
<a href="#generator">
Tools
</a>
</li>


<li>
<a href="https://github.com/ammsec/ReconCG" target="_blank">
GitHub
</a>
</li>

</ul>

</nav>





<header class="hero" id="home">


<h1>
Interactive Recon Command Generator
</h1>


<p>
Create reconnaissance commands in seconds.
</p>


<button onclick="document.getElementById('generator').scrollIntoView()">

Get Started

</button>


</header>







<section class="dashboard" id="generator">





<div class="sidebar">


<h3>
Recon Tools
</h3>



<button class="tool-btn active"
onclick="selectTool('nmap',this)">
Nmap
</button>



<button class="tool-btn"
onclick="selectTool('subfinder',this)">
Subfinder
</button>



<button class="tool-btn"
onclick="selectTool('httpx',this)">
httpx
</button>



<button class="tool-btn"
onclick="selectTool('ffuf',this)">
ffuf
</button>



<button class="tool-btn"
onclick="selectTool('gobuster',this)">
Gobuster
</button>



<button class="tool-btn"
onclick="selectTool('katana',this)">
Katana
</button>



<button class="tool-btn"
onclick="selectTool('nuclei',this)">
Nuclei
</button>



<button class="tool-btn"
onclick="selectTool('amass',this)">
Amass
</button>



</div>









<div class="generator-panel">



<h2 id="toolTitle">

Nmap Generator

</h2>



<p class="explanation">

Network scanner for discovering hosts, ports and services.

</p>





<!-- Dynamic fields generated by JavaScript -->

<div id="dynamicFields">

</div>







<div class="action-buttons">


<button onclick="generateCommand()">

Generate Command

</button>



<button onclick="copyCommand()">

Copy

</button>



<button onclick="resetForm()">

Reset

</button>


</div>






<textarea id="output" readonly placeholder="Generated command will appear here...">

</textarea>





</div>






</section>








<footer>


<p>
Built by ammsec
</p>


</footer>






<script src="assets/js/script.js"></script>


</body>

</html>
